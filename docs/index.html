<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131120">
  <meta name="description" content="歴史・科学・文化・ニュースを一文ずつ学べる、日本語のタイピング練習。">
  <title>知の打鍵 | 学べるタイピング</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="typing.js" defer></script>
  <script src="facts-extra.js" defer></script>
  <script src="stories.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C9 4.4 5.6 4.2 2.8 5.3v13c3-1.1 6.3-.9 9.2 1.2 2.9-2.1 6.2-2.3 9.2-1.2v-13c-2.8-1.1-6.2-.9-9.2 1.2Zm0 0v13"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4 19.5h16M7 16v-4m5 4V8m5 8V4"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3.5 9v6h4l5 4V5l-5 4h-4Zm12 0a4.2 4.2 0 0 1 0 6m2.7-8.7a8 8 0 0 1 0 11.4"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M3.5 9v6h4l5 4V5l-5 4h-4Zm12.7 1 4 4m0-4-4 4"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.5c.8 6.1 3.4 8.7 9.5 9.5-6.1.8-8.7 3.4-9.5 9.5-.8-6.1-3.4-8.7-9.5-9.5 6.1-.8 8.7-3.4 9.5-9.5Z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5H3Zm2 11h14M7 11v6m5-6v6m5-6v6"/></symbol>
    <symbol id="i-science" viewBox="0 0 24 24"><path d="M9 4h6m-5 0v6l-5 8a1.3 1.3 0 0 0 1.1 2h11.8a1.3 1.3 0 0 0 1.1-2l-5-8V4M8 14h8"/></symbol>
    <symbol id="i-culture" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 0-8 8h.8a1.8 1.8 0 0 0 1.2-3.1 1.4 1.4 0 0 1 1-2.4h2.5A2.5 2.5 0 0 0 20 12Z"/><path d="M8 12h.01m2-4h.01m4 0h.01m3 3h.01" stroke-width="2.5"/></symbol>
    <symbol id="i-news" viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="15" rx="2"/><path d="M8 9h8m-8 4h8m-8 3h4"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01m3.3 0h.01m3.3 0h.01m3.3 0h.01M8 14h8"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5 10a7.5 7.5 0 1 1 .6 6M5 5v5h5"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.8 17.8a8.8 8.8 0 1 1 14.4 0M12 14l4-5M5 14h2m5-7v2m5 5h2"/><circle cx="12" cy="14" r="1.3"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 1.5"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-8 8m8 0v4a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
  </svg>
  <header class="header">
    <div class="frame header-inner">
      <div class="brand"><span class="brand-mark"><svg><use href="#i-book"/></svg></span><span>知の打鍵</span></div>
      <div class="header-actions">
        <button type="button" class="quiet" id="sound" aria-label="打鍵音" aria-pressed="false" title="打鍵音を切り替える"><svg><use href="#i-muted" id="sound-icon"/></svg></button>
        <button type="button" class="quiet record-button" id="open-records"><svg><use href="#i-stats"/></svg><span>練習記録</span></button>
      </div>
    </div>
  </header>

  <main class="frame">
    <section class="hero" aria-labelledby="main-title">
      <div class="hero-copy">
        <p class="eyebrow"><svg><use href="#i-spark"/></svg> THE TYPING JOURNAL</p>
        <h1 id="main-title">打つたび、<br><span>世界がひろがる。</span></h1>
        <p class="hero-description">歴史、科学、文化、ニュース。<br class="narrow">一文ずつ、知らなかった世界をのぞいてみよう。</p>
      </div>
      <img class="hero-art" src="artwork.svg" alt="" width="430" height="236">
      <span class="hero-index" aria-hidden="true">01 / DISCOVER BY TYPING</span>
    </section>

    <section class="practice" aria-label="タイピング練習">
      <div class="topic-nav">
        <div class="nav-label" id="topic-label">ジャンル</div>
        <div class="filters" role="group" aria-labelledby="topic-label">
          <button type="button" data-genre="all" aria-pressed="true"><svg><use href="#i-grid"/></svg>すべて</button>
          <button type="button" data-genre="history" aria-pressed="false"><svg><use href="#i-history"/></svg>歴史</button>
          <button type="button" data-genre="science" aria-pressed="false"><svg><use href="#i-science"/></svg>科学</button>
          <button type="button" data-genre="culture" aria-pressed="false"><svg><use href="#i-culture"/></svg>文化</button>
          <button type="button" data-genre="news" aria-pressed="false"><svg><use href="#i-news"/></svg>ニュース</button>
        </div>
        <span class="topic-count" id="topic-count"></span>
      </div>

      <article class="practice-card">
        <header class="lesson-header">
          <div class="lesson-info">
            <span class="lesson-genre" id="lesson-genre">歴史</span>
            <h2 id="lesson-title"></h2>
            <time id="lesson-date" hidden></time>
          </div>
          <div class="chapter-status"><span class="chapter-dots" id="chapter-dots" aria-hidden="true"></span><span id="chapter-count" aria-label="練習の進み具合">01 / 04</span></div>
        </header>

        <div class="lesson-body">
          <div class="lesson-content" id="lesson-content">
            <div class="typing-surface" id="typing-surface">
              <p class="passage" id="passage" aria-live="polite"></p>
              <p class="romaji" id="romaji" lang="en"><span id="typed" class="typed"></span><span id="next-character" class="next-character"></span><span id="remaining"></span></p>
              <input id="typing-input" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="ローマ字を入力" aria-describedby="typing-hint romaji">
            </div>
            <p class="typing-hint" id="typing-hint"><svg><use href="#i-keyboard"/></svg><span>半角英数で入力するとスタート</span></p>
          </div>
          <div class="lesson-result" id="lesson-result" hidden>
            <div class="result-heading"><span class="result-check"><svg><use href="#i-check"/></svg></span><div><p class="eyebrow">TOPIC COMPLETE</p><p id="result-heading" tabindex="-1">このテーマを読み終えました</p></div></div>
            <ul class="result-notes" id="result-notes"></ul>
          </div>
        </div>

        <footer class="lesson-footer">
          <a id="lesson-source" class="source-link" target="_blank" rel="noopener noreferrer" hidden><svg><use href="#i-book"/></svg><span>出典を読む</span><svg class="external"><use href="#i-external"/></svg></a>
          <div class="lesson-actions">
            <button type="button" class="quiet restart-button" id="restart" title="最初の文に戻る（Esc）"><svg><use href="#i-reset"/></svg>やり直す</button>
            <button type="button" class="next-button" id="next" title="読了後は Enter でも次のテーマに進めます">次のテーマ <svg><use href="#i-next"/></svg></button>
          </div>
        </footer>
      </article>

      <div class="metrics" aria-label="今回の練習結果">
        <div class="metric"><span class="metric-icon"><svg><use href="#i-gauge"/></svg></span><div><p>入力速度</p><p><strong id="speed">–</strong><span>打 / 分</span></p></div></div>
        <div class="metric"><span class="metric-icon"><svg><use href="#i-target"/></svg></span><div><p>正確率</p><p><strong id="accuracy">–</strong><span>%</span></p></div></div>
        <div class="metric"><span class="metric-icon"><svg><use href="#i-clock"/></svg></span><div><p>経過時間</p><p><strong id="elapsed">0:00</strong></p></div></div>
      </div>
    </section>
    <footer class="page-footer"><p><svg><use href="#i-book"/></svg> 知の打鍵</p><p>ひと打ちずつ、知る楽しさを。</p></footer>
  </main>

  <dialog class="records-dialog" id="records" aria-labelledby="records-title">
    <form method="dialog"><button type="submit" class="quiet close-button" aria-label="練習記録を閉じる"><svg><use href="#i-close"/></svg></button></form>
    <p class="eyebrow"><svg><use href="#i-stats"/></svg> YOUR PROGRESS</p>
    <h2 id="records-title">練習記録</h2>
    <p class="records-summary" id="records-summary"></p>
    <ul class="record-list" id="record-list"></ul>
  </dialog>
  <noscript><p class="frame">タイピング練習を始めるには、ブラウザで JavaScript を有効にしてください。</p></noscript>
</body>
</html>
